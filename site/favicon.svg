  <g fill="#ecfeff">
    <rect x="6" y="7" width="4" height="4" rx="1"/>
    <rect x="14" y="7" width="4" height="4" rx="1" opacity=".35"/>
    <rect x="22" y="7" width="4" height="4" rx="1"/>
    <rect x="6" y="14" width="4" height="4" rx="1"/>
    <rect x="14" y="14" width="4" height="4" rx="1"/>
    <rect x="22" y="14" width="4" height="4" rx="1" opacity=".35"/>
    <rect x="6" y="21" width="4" height="4" rx="1"/>
    <rect x="14" y="21" width="4" height="4" rx="1" opacity=".35"/>
    <rect x="22" y="21" width="4" height="4" rx="1" opacity=".35"/>
  </g>
</svg>
