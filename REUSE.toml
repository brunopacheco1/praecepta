# SPDX-FileCopyrightText: Bruno Pacheco
#
# SPDX-License-Identifier: Apache-2.0

# Licensing for files that cannot carry a comment header (https://reuse.software/spec-3.3/).
version = 1

[[annotations]]
path = [
    "NOTICE",
    ".vscode/settings.json",
    "**/*.csv",
    "**/*.xlsx",
    "**/*.dmn",
    # fuzz-test inputs (seeds and any crash reproducers), which are raw data
    "**/*FuzzTestInputs/**",
    # the compiler's golden generated sources and DMN, compared byte for byte
    "praecepta-compiler/src/test/resources/golden/**",
    # benchmark results: JMH output, logs and generated summaries
    "praecepta-benchmarks/results/**",
    # the social image, rendered from site/brand/social.svg
    "site/brand/social.png",
    # last known badge values for the website (JSON has no comments)
    "site/badges.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Bruno Pacheco"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# web fonts for the project site, subset from google/fonts; their licence travels with them
path = ["site/fonts/*.woff2", "site/fonts/OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = [
    "2020 The Cinzel Project Authors (https://github.com/NDISCOVER/Cinzel)",
    "2017 The EB Garamond Project Authors (https://github.com/octaviopardo/EBGaramond12)",
]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
# test cases copied from the DMN TCK (https://github.com/dmn-tck/tck); see praecepta-tck/README.md
path = "praecepta-tck/src/test/resources/tck/**"
precedence = "override"
SPDX-FileCopyrightText = "The DMN TCK contributors (https://github.com/dmn-tck/tck)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# the Maven Wrapper scripts, generated by maven-wrapper-plugin 3.3.4 with their ASF header kept as is
path = ["mvnw", "mvnw.cmd", ".mvn/wrapper/maven-wrapper.properties"]
precedence = "override"
SPDX-FileCopyrightText = "The Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"
