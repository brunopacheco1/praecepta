# Licensing for files that cannot carry a comment header (https://reuse.software/spec-3.3/).
version = 1

[[annotations]]
path = [
    "NOTICE",
    ".vscode/settings.json",
    "**/*.csv",
    "**/*.xlsx",
    "**/*.dmn",
    # fuzz-test inputs (seeds and any crash reproducers), which are raw data
    "**/*FuzzTestInputs/**",
    # benchmark results: JMH output, logs and generated summaries
    "praecepta-benchmarks/results/**",
    # the social image, rendered from site/brand/social.svg
    "site/brand/social.png",
    # last known badge values for the website (JSON has no comments)
    "site/badges.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Bruno Pacheco"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# web fonts for the project site, subset from google/fonts; their licence travels with them
path = ["site/fonts/*.woff2", "site/fonts/OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = [
    "2020 The Cinzel Project Authors (https://github.com/NDISCOVER/Cinzel)",
    "2017 The EB Garamond Project Authors (https://github.com/octaviopardo/EBGaramond12)",
]
SPDX-License-Identifier = "OFL-1.1"
