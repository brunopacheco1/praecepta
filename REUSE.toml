version = 1

[[annotations]]
path = [
    "NOTICE",
    ".vscode/settings.json",
    "**/*.csv",
    "**/*.xlsx",
    "**/*.dmn",
    # fuzz-test inputs (seeds and any crash reproducers), which are raw data
    "**/*FuzzTestInputs/**",
    # benchmark results: JMH output, logs and generated summaries
    "praecepta-benchmarks/results/**",
]
precedence = "aggregate"
