# The Gradle plugin's functional tests (Gradle TestKit) on each Gradle version it supports: small projects
# apply it by id and version, resolved through its marker from the artifacts this build installs, and run
# with the build cache and the configuration cache. On pull requests only when the plugin, its marker, the
# compiler, loader and engine it compiles tables with, or their POMs change; always on main, and weekly so
# a new Gradle release is noticed.
name: Gradle versions
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'praecepta-gradle-plugin/**'
      - 'praecepta-gradle-plugin-marker/**'
      - 'praecepta-compiler/src/main/**'
      - 'praecepta-loader/src/main/**'
      - 'praecepta-engine/src/main/**'
      - 'pom.xml'
      - 'praecepta-compiler/pom.xml'
      - 'praecepta-loader/pom.xml'
      - 'praecepta-engine/pom.xml'
      - '.mvn/**'
      - '.github/workflows/gradle-versions.yml'
  schedule:
    - cron: '47 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same pull request replaces the run in progress; pushes to main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gradle:
    name: Gradle ${{ matrix.gradle }} (plugin)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Gradle the plugin supports: the first that runs on Java 21, which the plugin needs
          - gradle: '8.5'
            java: '21'
          # the last Gradle 8
          - gradle: '8.14.7'
            java: '21'
          # the current Gradle
          - gradle: '9.8.2'
            java: '25'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build the plugin and run its functional tests
        # TestKit downloads the Gradle distribution. The modules the plugin depends on are built but their
        # tests, which the Java CI workflow runs, are not: only the plugin's own tests run here.
        run: >
          mvn -B -pl praecepta-gradle-plugin -am verify -P gradle-functional
          -Dpraecepta.gradle.version=${{ matrix.gradle }}
          -Dtest=PraeceptaPluginTest -Dsurefire.failIfNoSpecifiedTests=false
