# The framework integrations as GraalVM native executables (#99): builds the test applications of
# praecepta-native-tests (a Spring Boot, a Micronaut and a Quarkus application, each with the framework's own
# native build), runs each executable, and checks the answers it gets from the injected engines. A native
# build takes minutes, so this runs on pull requests only when a framework module, the integration core, what
# the Quarkus build compiles its CSV table with (the compiler and the loader), the engine's native-image
# metadata or the test applications change; on main, where any change to the engine reaches it; weekly so new
# GraalVM and framework releases are noticed; and on demand.
name: Native frameworks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'praecepta-engine/src/main/resources/**'
      - 'praecepta-compiler/src/main/**'
      - 'praecepta-loader/src/main/**'
      - 'praecepta-integration/src/main/**'
      - 'praecepta-spring-boot4-starter/src/main/**'
      - 'praecepta-micronaut4/src/main/**'
      - 'praecepta-quarkus3/src/main/**'
      - 'praecepta-quarkus3-deployment/src/main/**'
      - 'praecepta-engine/pom.xml'
      - 'praecepta-compiler/pom.xml'
      - 'praecepta-loader/pom.xml'
      - 'praecepta-integration/pom.xml'
      - 'praecepta-spring-boot4-starter/pom.xml'
      - 'praecepta-micronaut4/pom.xml'
      - 'praecepta-quarkus3/pom.xml'
      - 'praecepta-quarkus3-deployment/pom.xml'
      - 'praecepta-native-tests/**'
      # the framework versions
      - 'pom.xml'
      - '.github/workflows/native-frameworks.yml'
      # how the build resolves and caches its dependencies
      - '.mvn/maven.config'
      - '.github/actions/maven-cache/**'
      - '.github/scripts/retry_downloads.py'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same pull request replaces the run in progress; pushes to main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    # Each application once (#164), on GraalVM for the higher of Java 21 and its framework's own baseline
    # (GOVERNANCE.md, "What is supported"): Micronaut 4 on 21; Spring Boot 4 and Quarkus 3.40 need 25
    name: ${{ matrix.app }} (GraalVM for JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: spring-boot-app
            java: '25'
          - app: micronaut-app
            java: '21'
          - app: quarkus-app
            java: '25'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        with:
          distribution: graalvm-community
          java-version: ${{ matrix.java }}
      - id: maven-cache
        # one cache per application: each resolves its framework into the invoker's repository
        uses: ./.github/actions/maven-cache
        with:
          name: native-${{ matrix.app }}
      - name: Build the native executable and run it
        # the native-frameworks profile adds praecepta-native-tests to the reactor; its invoker builds the
        # application natively and runs it. The unit tests already ran in the Java CI workflow.
        run: |
          native-image --version
          python3 .github/scripts/retry_downloads.py \
            mvn -B -P native-frameworks -pl praecepta-native-tests -am verify -DskipTests -Dinvoker.test=${{ matrix.app }}
      - name: Save the Maven cache
        uses: ./.github/actions/maven-cache
        with:
          name: native-${{ matrix.app }}
          save: true
          key: ${{ steps.maven-cache.outputs.key }}
          restored-key: ${{ steps.maven-cache.outputs.restored-key }}
