name: ClusterFuzzLite
# Fuzzes every pull request that touches the engine for 5 minutes, with the targets that
# .clusterfuzzlite/build.sh builds (the same ones the JUnit fuzz tests run). A crash fails the job
# and its report names the input: add it under the test's ...FuzzTestInputs directory, fix the bug,
# and it stays a regression test. The weekly long run is in fuzz.yml.
on:
  pull_request:
    paths:
      - 'praecepta-engine/src/main/**'
      - 'praecepta-engine/src/test/java/**/*Fuzzer.java'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz the change
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          mode: code-change
          sanitizer: address
          fuzz-seconds: 300
          github-token: ${{ secrets.GITHUB_TOKEN }}
