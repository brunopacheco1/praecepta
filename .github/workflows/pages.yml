name: Website
# Publishes the project page (site/) with the API documentation of the latest release on GitHub
# Pages: https://bruno.pacheco.lu/praecepta/. Runs when the page changes, after every successful
# release, and on demand. It always runs on main (the only branch the github-pages environment
# deploys from) and documents the latest release tag.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '17 4 * * 1' # weekly, so the badge values stay current
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release tags
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Find the latest release
        run: |
          tag=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: Build the API documentation of ${{ env.TAG }}
        # as the release workflow does: set the version, then build the javadoc jars
        run: |
          git worktree add ../release "${TAG}"
          cd ../release
          mvn -B -q versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false -DprocessAllModules
          mvn -B -q -Prelease -DskipTests -Dinvoker.skip -Dlicense.skip -Dgpg.skip -pl '!praecepta-benchmarks,!praecepta-tck' package
      - name: Read the OpenSSF badge values
        # read at build time, so visitors' browsers never contact these services; if a lookup fails,
        # the last known values in site/badges.json stay. Each phalera's metal follows its level:
        # Best Practices passing/silver/gold, Baseline I/II/III, Scorecard below 6/6 to 8/8 and above.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          best_practices=$(jq -r .best_practices site/badges.json)
          baseline=$(jq -r .baseline site/badges.json)
          scorecard=$(jq -r .scorecard site/badges.json)
          if project=$(curl -fsS --max-time 20 https://www.bestpractices.dev/projects/16426.json); then
            level=$(jq -r '.badge_level // empty' <<< "$project")
            case "$level" in
              passing|silver|gold) best_practices="$level" ;;
              *) ;; # any other level keeps the last known value
            esac
            for n in 3 2 1; do
              if [ "$(jq -r ".badge_percentage_baseline_$n // 0" <<< "$project")" = "100" ]; then
                baseline=$n
                break
              fi
            done
          fi
          if card=$(curl -fsS --max-time 20 https://api.scorecard.dev/projects/github.com/brunopacheco1/praecepta); then
            score=$(jq -r '.score // empty' <<< "$card")
            [[ "$score" =~ ^[0-9]+(\.[0-9]+)?$ ]] && scorecard="$score"
          fi
          case "$best_practices" in gold) bp_metal=gold ;; silver) bp_metal=silver ;; *) bp_metal=bronze ;; esac
          case "$baseline" in 3) baseline_value=III baseline_metal=gold ;; 2) baseline_value=II baseline_metal=silver ;; *) baseline_value=I baseline_metal=bronze ;; esac
          [[ "$scorecard" =~ ^[0-9]+(\.[0-9]+)?$ ]] || scorecard=0
          scorecard_metal=$(awk -v s="$scorecard" 'BEGIN { print (s >= 8 ? "gold" : (s >= 6 ? "silver" : "bronze")) }')
          # the live checks (armillae): SonarCloud's gate and coverage, the latest CodeQL run on main and
          # the FSFE's REUSE check; a lookup that fails or has not finished keeps the last known value
          gate=$(jq -r .quality_gate site/badges.json)
          coverage=$(jq -r .coverage site/badges.json)
          codeql=$(jq -r .codeql site/badges.json)
          reuse=$(jq -r .reuse site/badges.json)
          reproducible=$(jq -r .reproducible site/badges.json)
          sonar=https://sonarcloud.io/api
          if status=$(curl -fsS --max-time 20 "$sonar/qualitygates/project_status?projectKey=brunopacheco1_praecepta"); then
            case "$(jq -r '.projectStatus.status // empty' <<< "$status")" in
              OK) gate=passed ;;
              ERROR) gate=failing ;;
              *) ;; # any other status keeps the last known value
            esac
          fi
          if measures=$(curl -fsS --max-time 20 "$sonar/measures/component?component=brunopacheco1_praecepta&metricKeys=coverage"); then
            value=$(jq -r '.component.measures[0].value // empty' <<< "$measures")
            [[ "$value" =~ ^[0-9]+(\.[0-9]+)?$ ]] && coverage="$value"
          fi
          github="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          if runs=$(curl -fsS --max-time 20 "${auth[@]}" "$github/actions/workflows/codeql.yml/runs?branch=main&status=completed&per_page=1"); then
            case "$(jq -r '.workflow_runs[0].conclusion // empty' <<< "$runs")" in
              success) codeql=passing ;;
              failure) codeql=failing ;;
              *) ;; # any other conclusion keeps the last known value
            esac
          fi
          # REUSE: the FSFE's own check of the repository (api.reuse.software), not our CI
          if lint=$(curl -fsS --max-time 20 https://api.reuse.software/status/github.com/brunopacheco1/praecepta); then
            case "$(jq -r '.status // empty' <<< "$lint")" in
              compliant) reuse=compliant ;;
              non-compliant) reuse=failing ;;
              *) ;; # any other status keeps the last known value
            esac
          fi
          # Reproducible Builds: Reproducible Central's independent rebuild, compared with Maven Central
          if rb=$(curl -fsS --max-time 20 https://raw.githubusercontent.com/jvm-repo-rebuild/reproducible-central/master/content/io/github/brunopacheco1/praecepta/badge.json); then
            value=$(jq -r '.message // empty' <<< "$rb")
            [[ "$value" =~ ^[0-9]+/[0-9]+$ ]] && reproducible="$value"
          fi
          [[ "$coverage" =~ ^[0-9]+(\.[0-9]+)?$ ]] || coverage=0
          [[ "$reproducible" =~ ^[0-9]+/[0-9]+$ ]] || reproducible=0/0
          reproducible_ok=${reproducible%/*}
          reproducible_all=${reproducible#*/}
          reproducible_state=$(awk -v ok="$reproducible_ok" -v all="$reproducible_all" 'BEGIN { print (all > 0 && ok == all ? "ok" : "failing") }')
          state() {
            local check="$1"
            [ "$check" = failing ] && echo failing || echo ok
          }
          coverage_state=$(awk -v c="$coverage" 'BEGIN { print (c >= 80 ? "ok" : "failing") }')
          {
            echo "GATE=${gate^^}"
            echo "GATE_NAME=${gate^}"
            echo "GATE_STATE=$(state "$gate")"
            echo "COVERAGE=${coverage}%"
            echo "COVERAGE_STATE=$coverage_state"
            echo "CODEQL=${codeql^^}"
            echo "CODEQL_NAME=${codeql^}"
            echo "CODEQL_STATE=$(state "$codeql")"
            echo "REUSE=${reuse^^}"
            echo "REUSE_NAME=${reuse^}"
            echo "REUSE_STATE=$(state "$reuse")"
            echo "REPRODUCIBLE_OK=$reproducible_ok"
            echo "REPRODUCIBLE_ALL=$reproducible_all"
            echo "REPRODUCIBLE_STATE=$reproducible_state"
          } | tr -cd 'A-Za-z0-9._%=\n' >> "$GITHUB_ENV"
          {
            echo "BP_METAL=$bp_metal"
            echo "BP_VALUE=${best_practices^^}"
            echo "BP_NAME=${best_practices^}"
            echo "BASELINE_METAL=$baseline_metal"
            echo "BASELINE_VALUE=$baseline_value"
            echo "BASELINE_LEVEL=$baseline"
            echo "SCORECARD_METAL=$scorecard_metal"
            echo "SCORECARD_VALUE=$scorecard"
          } | tr -cd 'A-Za-z0-9._=\n' >> "$GITHUB_ENV"
      - name: Assemble the site
        run: |
          mkdir -p _site/api
          cp -R site/. _site/
          sed -i -e "s/@VERSION@/${VERSION}/g" \
            -e "s/@BP_METAL@/${BP_METAL}/g" -e "s/@BP_VALUE@/${BP_VALUE}/g" -e "s/@BP_NAME@/${BP_NAME}/g" \
            -e "s/@BASELINE_METAL@/${BASELINE_METAL}/g" -e "s/@BASELINE_VALUE@/${BASELINE_VALUE}/g" -e "s/@BASELINE_LEVEL@/${BASELINE_LEVEL}/g" \
            -e "s/@SCORECARD_METAL@/${SCORECARD_METAL}/g" -e "s/@SCORECARD_VALUE@/${SCORECARD_VALUE}/g" \
            -e "s/@GATE_STATE@/${GATE_STATE}/g" -e "s/@GATE_NAME@/${GATE_NAME}/g" -e "s/@GATE@/${GATE}/g" \
            -e "s/@COVERAGE_STATE@/${COVERAGE_STATE}/g" -e "s/@COVERAGE@/${COVERAGE}/g" \
            -e "s/@CODEQL_STATE@/${CODEQL_STATE}/g" -e "s/@CODEQL_NAME@/${CODEQL_NAME}/g" -e "s/@CODEQL@/${CODEQL}/g" \
            -e "s/@REUSE_STATE@/${REUSE_STATE}/g" -e "s/@REUSE_NAME@/${REUSE_NAME}/g" -e "s/@REUSE@/${REUSE}/g" \
            -e "s/@REPRODUCIBLE_STATE@/${REPRODUCIBLE_STATE}/g" -e "s/@REPRODUCIBLE_OK@/${REPRODUCIBLE_OK}/g" \
            -e "s/@REPRODUCIBLE_ALL@/${REPRODUCIBLE_ALL}/g" _site/index.html
          # every published module's API documentation, at api/<module without "praecepta-">
          # (praecepta-engine at api/engine; a nested module a/b would be at api/a-b), so a new
          # module needs no change here
          shopt -s nullglob
          for apidocs in ../release/*/target/reports/apidocs ../release/*/*/target/reports/apidocs; do
            module="${apidocs#../release/}"
            module="${module%/target/reports/apidocs}"
            module="${module//\//-}"
            cp -R "${apidocs}" "_site/api/${module#praecepta-}"
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
