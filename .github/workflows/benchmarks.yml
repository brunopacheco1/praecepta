name: Benchmarks
# On demand only. Shared GitHub runners are noisy: use these results to spot large regressions or
# compare engines within one run, not to publish absolute numbers.
on:
  workflow_dispatch:
    inputs:
      jmh-args:
        description: 'Extra JMH arguments, e.g. "-p table=real -p engine=praecepta"'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  jmh:
    name: JMH (Praecepta vs Camunda vs Drools)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build benchmarks
        run: mvn -B -pl praecepta-benchmarks -am package -DskipTests
      - name: Footprint
        run: |
          for table in real synthetic-100 synthetic-1000 mixed-100 mixed-1000; do
            for engine in praecepta camunda drools; do
              java -Xmx6g -cp praecepta-benchmarks/target/benchmarks.jar \
                io.github.brunopacheco1.praecepta.benchmarks.FootprintReport "$engine" "$table" | tail -n 1
            done
          done | tee footprint.txt
      - name: Latency
        env:
          JMH_ARGS: ${{ inputs.jmh-args }}
        run: java -jar praecepta-benchmarks/target/benchmarks.jar -rf json -rff jmh-results.json $JMH_ARGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            jmh-results.json
            footprint.txt
