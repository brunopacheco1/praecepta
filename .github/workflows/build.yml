name: Java CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Java 25)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for SonarCloud blame data
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build & test
        run: mvn -B verify
      - name: SonarCloud analysis
        # Secrets are not exposed to pull requests from forks; skip instead of failing.
        if: ${{ env.SONAR_TOKEN != '' }}
        # Advisory: an expired token or a SonarCloud outage must not block merging a green build.
        continue-on-error: true
        # `verify` in the same invocation lets the scanner resolve the reactor modules; tests and
        # coverage data come from the previous step.
        run: mvn -B verify -DskipTests org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
