name: Java CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Java 25)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for SonarCloud blame data
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build & test
        # also checks SPDX headers (license-maven-plugin) and writes SBOMs (target/bom.json)
        run: mvn -B verify
      - name: Check dependency licences
        run: >
          python3 .github/scripts/check_sbom_licenses.py
          praecepta-engine/target/bom.json
          praecepta-loader/target/bom.json
          praecepta-maven-plugin/target/bom.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            praecepta-engine/target/bom.json
            praecepta-loader/target/bom.json
            praecepta-maven-plugin/target/bom.json
      - name: SonarCloud analysis and quality gate
        # Mandatory: the scanner waits for the quality gate and fails this job if the gate fails,
        # the token is missing or expired, or the analysis errors.
        # GitHub never gives secrets to pull requests from forks, so those cannot be analysed here.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        # `verify` in the same invocation lets the scanner resolve the reactor modules; tests and
        # coverage data come from the previous step.
        run: >
          mvn -B verify -DskipTests
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=600
      - name: SonarCloud skipped (pull request from a fork)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "::warning title=SonarCloud not run::Pull requests from forks get no secrets; a maintainer must analyse this change before merging."

  java:
    # the code targets Java 21 (--release 21); prove it builds and passes on the oldest and newest JDKs
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '27']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build & test
        run: mvn -B verify

  maven:
    # the Maven plugin's integration tests (src/it) run with the Maven building them
    name: Maven ${{ matrix.maven }} (plugin)
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.preview }}
    strategy:
      fail-fast: false
      matrix:
        maven: ['3.9.16', '3.10.0']
        preview: [false]
        include:
          - maven: '4.0.0-rc-7' # release candidate: reported, not blocking
            preview: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install Maven ${{ matrix.maven }} (wrapper)
        run: mvn -B -N org.apache.maven.plugins:maven-wrapper-plugin:3.3.4:wrapper -Dmaven=${{ matrix.maven }}
      - name: Build the plugin and run its integration tests
        run: |
          ./mvnw -B --version
          ./mvnw -B -pl praecepta-maven-plugin -am verify

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  vulnerabilities:
    name: Known vulnerabilities (SBOM)
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      download-artifact: sbom
      # the engine has no dependencies; the loader and plugin carry Apache POI's tree
      scan-args: |-
        -L praecepta-loader/target/bom.json
        -L praecepta-maven-plugin/target/bom.json
      # advisory for now: findings go to Security > Code scanning without blocking merges
      fail-on-vuln: false
