name: Java CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# a newer push to the same pull request replaces the run in progress; pushes to main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # One job per supported JDK: the code targets Java 21 (--release 21) and must build and pass
    # on the oldest and newest JDKs. Licences, SBOMs and SonarCloud run once, on the LTS (25);
    # "Build & test (Java 25)" is the required check in the main branch ruleset.
    name: Build & test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25', '27']
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PRIMARY: ${{ matrix.java == '25' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for SonarCloud blame data
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build & test
        # also checks SPDX headers (license-maven-plugin), runs the plugin's integration tests and
        # writes SBOMs (target/bom.json)
        run: mvn -B verify
      - name: Test the workflow scripts
        if: ${{ env.PRIMARY == 'true' }}
        # their release-only paths (published_modules.py jars) would otherwise first run on a release tag
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check dependency licences
        if: ${{ env.PRIMARY == 'true' }}
        # every published module writes an SBOM; modules that are never published skip theirs
        # (published_modules.py), so new modules are checked without being listed here
        run: |
          mapfile -t sboms < <(python3 .github/scripts/published_modules.py sboms)
          python3 .github/scripts/check_sbom_licenses.py "${sboms[@]}"
          python3 .github/scripts/published_modules.py merge-sboms target/published-sbom/bom.json
      - name: Upload SBOMs
        if: ${{ env.PRIMARY == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          # each published module's SBOM, and all of them merged for the vulnerability scan
          path: |
            **/target/bom.json
            !**/target/it/**
            target/published-sbom/bom.json
      - name: SonarCloud analysis and quality gate
        # Mandatory: the scanner waits for the quality gate and fails this job if the gate fails,
        # the token is missing or expired, or the analysis errors.
        # GitHub never gives secrets to pull requests from forks, so those cannot be analysed here.
        if: ${{ env.PRIMARY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        # `verify` in the same invocation lets the scanner resolve the reactor modules; tests and
        # coverage data come from the previous step.
        run: >
          mvn -B verify -DskipTests -Dinvoker.skip
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=600
      - name: SonarCloud skipped (pull request from a fork)
        if: ${{ env.PRIMARY == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "::warning title=SonarCloud not run::Pull requests from forks get no secrets; a maintainer must analyse this change before merging."

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  vulnerabilities:
    name: Known vulnerabilities (SBOM)
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      download-artifact: sbom
      # the components of every published module, merged into one SBOM by the build job
      # (the engine has none; the loader, compiler and build plugins carry Apache POI's tree)
      scan-args: |-
        -L target/published-sbom/bom.json
      # advisory for now: findings go to Security > Code scanning without blocking merges
      fail-on-vuln: false
