name: Java CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Java 25)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for SonarCloud blame data
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build & test
        # also checks SPDX headers (license-maven-plugin) and writes SBOMs (target/bom.json)
        run: mvn -B verify
      - name: Check dependency licences
        run: >
          python3 .github/scripts/check_sbom_licenses.py
          praecepta-engine/target/bom.json
          praecepta-loader/target/bom.json
          praecepta-maven-plugin/target/bom.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            praecepta-engine/target/bom.json
            praecepta-loader/target/bom.json
            praecepta-maven-plugin/target/bom.json
      - name: SonarCloud analysis
        # Secrets are not exposed to pull requests from forks; skip instead of failing.
        if: ${{ env.SONAR_TOKEN != '' }}
        # Advisory: an expired token or a SonarCloud outage must not block merging a green build.
        continue-on-error: true
        # `verify` in the same invocation lets the scanner resolve the reactor modules; tests and
        # coverage data come from the previous step.
        run: mvn -B verify -DskipTests org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  vulnerabilities:
    name: Known vulnerabilities (SBOM)
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      download-artifact: sbom
      # the engine has no dependencies; the loader and plugin carry Apache POI's tree
      scan-args: |-
        -L praecepta-loader/target/bom.json
        -L praecepta-maven-plugin/target/bom.json
      # advisory for now: findings go to Security > Code scanning without blocking merges
      fail-on-vuln: false
