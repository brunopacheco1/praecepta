name: Java CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# a newer push to the same pull request replaces the run in progress; pushes to main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # As the support policy says (GOVERNANCE.md, "What is supported"): built as the release is, with the
    # latest long-term-support JDK (25), which also runs the strict TCK check, the licences, the SBOMs and
    # SonarCloud; and tested on Java 21, the baseline the code targets (--release 21). A JDK nobody
    # targets is not tested (#164). Both jobs are required checks in the main branch ruleset.
    name: Build & test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PRIMARY: ${{ matrix.java == '25' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for SonarCloud blame data
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - id: maven-cache
        uses: ./.github/actions/maven-cache
      - name: Build & test
        # also checks SPDX headers (license-maven-plugin), runs the plugin's integration tests and
        # writes SBOMs (target/bom.json); on the LTS, the TCK fails when RESULTS.md or its baseline is
        # out of date, so a pull request that changes what passes regenerates them (tck.strict).
        # retry_downloads.py runs the build once more if it failed on a download only.
        run: python3 .github/scripts/retry_downloads.py mvn -B verify -Dtck.strict=${{ env.PRIMARY }}
      - name: Test the workflow scripts
        if: ${{ env.PRIMARY == 'true' }}
        # their release-only paths (published_modules.py jars) would otherwise first run on a release tag
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check dependency licences
        if: ${{ env.PRIMARY == 'true' }}
        # every published module writes an SBOM; modules that are never published skip theirs
        # (published_modules.py), so new modules are checked without being listed here
        run: |
          mapfile -t sboms < <(python3 .github/scripts/published_modules.py sboms)
          python3 .github/scripts/check_sbom_licenses.py "${sboms[@]}"
          python3 .github/scripts/published_modules.py merge-sboms target/published-sbom/bom.json
      - name: Upload SBOMs
        if: ${{ env.PRIMARY == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          # each published module's SBOM, and all of them merged for the vulnerability scan
          path: |
            **/target/bom.json
            !**/target/it/**
            target/published-sbom/bom.json
      - name: SonarCloud analysis and quality gate
        # Mandatory: the scanner waits for the quality gate and fails this job if the gate fails,
        # the token is missing or expired, or the analysis errors.
        # GitHub never gives secrets to pull requests from forks, so those cannot be analysed here.
        if: ${{ env.PRIMARY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        # `verify` in the same invocation lets the scanner resolve the reactor modules; tests and
        # coverage data come from the previous step.
        run: >
          python3 .github/scripts/retry_downloads.py
          mvn -B verify -DskipTests -Dinvoker.skip
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=600
      - name: SonarCloud skipped (pull request from a fork)
        if: ${{ env.PRIMARY == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "::warning title=SonarCloud not run::Pull requests from forks get no secrets; a maintainer must analyse this change before merging."
      - name: Save the Maven cache
        # from main only, and from one job: both JDKs resolve the same artifacts
        if: ${{ env.PRIMARY == 'true' }}
        uses: ./.github/actions/maven-cache
        with:
          save: true
          key: ${{ steps.maven-cache.outputs.key }}
          restored-key: ${{ steps.maven-cache.outputs.restored-key }}

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  vulnerabilities:
    name: Known vulnerabilities (SBOM)
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      download-artifact: sbom
      # the components of every published module, merged into one SBOM by the build job
      # (the engine has none; the loader, compiler and build plugins carry Apache POI's tree)
      scan-args: |-
        -L target/published-sbom/bom.json
      # advisory for now: findings go to Security > Code scanning without blocking merges
      fail-on-vuln: false
