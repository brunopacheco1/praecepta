# GraalVM native images (#19): builds the Maven plugin's native-image test project
# (praecepta-maven-plugin/src/it/native-app) as a native executable with GraalVM's native-image, and runs
# it. The project uses the engine, the loader (CSV), the integration core and classes the plugin
# generates, and checks every answer; the same checks run on the JVM in every build. A native build
# takes minutes, so on pull requests this runs only when what goes into the executable changes; always
# on main, and weekly so a new GraalVM release is noticed.
name: Native image
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'praecepta-engine/src/main/**'
      - 'praecepta-loader/src/main/**'
      - 'praecepta-compiler/src/main/**'
      - 'praecepta-integration/src/main/**'
      - 'praecepta-maven-plugin/src/main/**'
      - 'praecepta-maven-plugin/src/it/native-app/**'
      - '**/pom.xml'
      - '.github/workflows/native.yml'
      # how the build resolves and caches its dependencies
      - '.mvn/maven.config'
      - '.github/actions/maven-cache/**'
      - '.github/scripts/retry_downloads.py'
  schedule:
    - cron: '47 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same pull request replaces the run in progress; pushes to main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    # GraalVM for Java 21, the baseline, once (#164): the application has no framework that needs a later one
    name: Native image (GraalVM for JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        with:
          distribution: graalvm-community
          java-version: '21'
      - id: maven-cache
        uses: ./.github/actions/maven-cache
        with:
          name: native
      - name: Build the native executable and run it
        # -Pnative: the plugin's invoker builds src/it/native-app with native-image and runs the executable;
        # the unit tests already ran in the Java CI workflow
        run: |
          native-image --version
          python3 .github/scripts/retry_downloads.py mvn -B -pl praecepta-maven-plugin -am verify -Pnative -DskipTests
      - name: Save the Maven cache
        uses: ./.github/actions/maven-cache
        with:
          name: native
          save: true
          key: ${{ steps.maven-cache.outputs.key }}
          restored-key: ${{ steps.maven-cache.outputs.restored-key }}
