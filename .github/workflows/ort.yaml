name: ORT sample

on:
  push:
    branches: [main]
  pull_request:
    # the scan is about dependencies and licences, so only build files and ORT's own config matter
    paths:
      - '**/pom.xml'
      - '.ort.yml'
      - '.github/workflows/ort.yaml'

# a newer push to the same pull request replaces the run in progress; pushes to main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run GitHub Action for ORT
        id: ort_scan
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1.2.0 (older pins used the retired upload-artifact@v3)
        with:
          allow-dynamic-versions: 'true'
          # the evaluator applies ORT's policy rules (ort-config: copyleft and unclassified licences,
          # missing project files...); excludes in .ort.yml keep it to what is published
          fail-on: 'violations'
          # PlainTextTemplate is the attribution (NOTICE) report
          report-formats: 'CycloneDx,SpdxDocument,WebApp,PlainTextTemplate'
          run: >
            cache-dependencies,
            labels,
            analyzer,
            evaluator,
            reporter,
            upload-results
