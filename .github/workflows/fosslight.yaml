name: FossLight

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  fosslight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # fosslight_source supports Python 3.10-3.14 ('3.x' picked 3.15, where a dependency has no wheel)
          python-version: '3.12'

      - name: Install FossLight
        run: |
          pip install fosslight_source==2.3.18

      - name: Run FossLight
        run: fosslight_source -p ./ -f yaml -j

      - name: Upload FossLight Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fosslight-report
          path: fosslight-report.json
