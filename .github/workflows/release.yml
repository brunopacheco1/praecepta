name: Release
# Pushing a signed tag vX.Y.Z publishes every published module (all but the benchmarks, the TCK runner
# and test projects) to Maven Central, then the Gradle plugin to the Gradle Plugin Portal. Owner setup and
# the release steps: docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    # the secrets live in this environment, so only this job can read them
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "$TAG")" != tag ]; then
            echo "::error::$TAG is a lightweight tag; create it with git tag -s"; exit 1
          fi
          # the maintainer's public keys, as published by GitHub (HTTPS only, redirects included)
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL "https://github.com/${GITHUB_REPOSITORY_OWNER}.gpg" | gpg --import
          git verify-tag "$TAG"
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"; exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          # writes ~/.m2/settings.xml with the Central Portal credentials read from these variables
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - name: Set the version from the tag
        # keep project.build.outputTimestamp as committed, so the release can be rebuilt from its
        # tag with nothing but the version changed (versions:set would otherwise stamp the time now)
        run: >
          ./mvnw -B versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false -DprocessAllModules
          -DupdateBuildOutputTimestampPolicy=never
      - name: Build, test, sign and publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        # Every module but the benchmarks and the TCK runner, which are slow to build and never
        # published; other unpublished modules (test projects) skip publishing in their POM. The
        # Maven Wrapper pins Maven (.mvn/wrapper), so the release is built with the same Maven that
        # Reproducible Central's buildspec names (tool=)
        run: ./mvnw -B -P release -pl '!praecepta-benchmarks,!praecepta-tck' deploy
      - name: Find the published modules
        # the modules whose signed jars the build left in target/, so this list needs no upkeep
        id: published
        run: |
          python3 .github/scripts/published_modules.py jars "${VERSION}" > published-modules.txt
          cat published-modules.txt
          {
            echo 'jars<<EOF'
            while read -r module artifact; do echo "${module}/target/${artifact}-${VERSION}.jar"; done < published-modules.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Third-party notices
        run: |
          mapfile -t sboms < <(python3 .github/scripts/published_modules.py sboms)
          python3 .github/scripts/third_party_notices.py "${VERSION}" "${sboms[@]}" > THIRD-PARTY-NOTICES.txt
      - name: Build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.published.outputs.jars }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes: this version's section of the changelog
          # (until the next version heading or the link references at the bottom)
          awk -v v="## [${VERSION}]" 'index($0, v) == 1 {on = 1; next} /^## \[/ || /^\[[^]]*\]: / {on = 0} on' CHANGELOG.md > notes.md
          files=()
          while read -r module artifact; do
            for suffix in .jar -sources.jar -javadoc.jar; do
              files+=("${module}/target/${artifact}-${VERSION}${suffix}" "${module}/target/${artifact}-${VERSION}${suffix}.asc")
            done
            cp "${module}/target/bom.json" "${artifact}-${VERSION}-cyclonedx.json"
            files+=("${artifact}-${VERSION}-cyclonedx.json")
          done < published-modules.txt
          # the signed provenance bundle (Sigstore, SLSA v1) beside the artifacts, so it can be
          # verified offline and found by tools such as the OpenSSF Scorecard
          cp "${{ steps.provenance.outputs.bundle-path }}" "praecepta-${VERSION}.intoto.jsonl"
          files+=("praecepta-${VERSION}.intoto.jsonl")
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Praecepta ${VERSION}" \
            --notes-file notes.md "${files[@]}" THIRD-PARTY-NOTICES.txt

  plugin-portal:
    name: Publish to the Gradle Plugin Portal
    # after Maven Central, from Maven Central's own files: the Portal then serves the jars and POM Maven built
    # and Reproducible Central rebuilds. A job of its own, so a failure here can be re-run alone.
    needs: release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle
        run: bash .github/scripts/install_gradle.sh
      - name: Fetch the plugin from Maven Central
        # the jars, and the POM in place of the tag's development one (the build checks its version)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          base="https://repo1.maven.org/maven2/io/github/brunopacheco1/praecepta-gradle-plugin/${VERSION}"
          mkdir -p praecepta-gradle-plugin/target
          fetch() {
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL --retry 10 --retry-all-errors \
              --retry-delay 30 -o "$1" "$2"
          }
          for suffix in .jar -sources.jar -javadoc.jar; do
            fetch "praecepta-gradle-plugin/target/praecepta-gradle-plugin-${VERSION}${suffix}" \
              "${base}/praecepta-gradle-plugin-${VERSION}${suffix}"
          done
          fetch praecepta-gradle-plugin/pom.xml "${base}/praecepta-gradle-plugin-${VERSION}.pom"
      - name: Publish
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: gradle --no-daemon -p praecepta-gradle-plugin/portal publishPlugins -Ppraecepta.version="${VERSION}"
