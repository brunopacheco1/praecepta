version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # one PR per week for build and test tooling; runtime dependencies stay separate
      build-and-test:
        patterns: ['org.apache.maven.plugins:*', 'org.junit*', 'org.assertj:*', 'net.jqwik:*', 'org.jacoco:*', 'com.mycila:*', 'org.cyclonedx:*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
