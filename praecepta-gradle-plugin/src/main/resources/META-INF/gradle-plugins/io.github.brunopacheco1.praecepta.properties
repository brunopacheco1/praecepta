# the plugin id io.github.brunopacheco1.praecepta (this file's name) and the class that implements it
implementation-class=io.github.brunopacheco1.praecepta.gradle.PraeceptaPlugin
# Declares support for Gradle's configuration cache, which the Gradle versions workflow runs the plugin with.
# The Gradle Plugin Portal reads it from here (plugin-publish's compatibility flags, as the Gradle
# compatibility plugin writes them), since the Portal build uploads this jar as Maven built it.
compatibility.feature.configuration-cache=DECLARED_SUPPORTED
