# A Spring Boot application built as a native executable, with Spring Boot's native profile, and run.
invoker.goals = verify
invoker.profiles = native
# Spring Boot 4 needs GraalVM for JDK 25: the native build tools it manages read GraalVM's shared metadata
# repository in a format that GraalVM for JDK 21 does not
invoker.java.version = 25+
