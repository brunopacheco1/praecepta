# A Quarkus application built as a native executable, with Quarkus' native build, and run.
invoker.goals = verify -Dnative
# Quarkus 3.40 refuses GraalVM for JDK 21 ("Quarkus currently supports 25.0.0")
invoker.java.version = 25+
