# rules/discount.dmn is found at the default location; this CSV table is compiled while Quarkus builds the
# application, so Apache POI and the CSV file stay out of the executable
quarkus.praecepta.tables.fees.source=src/main/rules/fees.csv
quarkus.praecepta.tables.fees.hit-policy=COLLECT
quarkus.praecepta.tables.fees.aggregation=SUM
quarkus.praecepta.tables.fees.inputs[0].name=zone
quarkus.praecepta.tables.fees.inputs[0].allowed-values="mainland","islands"
quarkus.praecepta.tables.fees.outputs[0].name=fee
quarkus.praecepta.tables.fees.outputs[0].type=NUMBER
quarkus.banner.enabled=false
